<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake · responsive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        
        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
            margin: 0;
        }
        
        .game-wrapper {
            background: #0b0b12;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }
        
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 0 4px;
        }
        
        .score-box {
            background: #22222e;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1.2rem;
            border: 1px solid #3a3a4a;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        
        .score-box span {
            color: #6af06a;
            font-weight: 800;
            margin-left: 8px;
            font-size: 1.5rem;
            text-shadow: 0 0 8px #6af06a88;
        }
        
        .restart-btn {
            background: #2e2e3e;
            border: none;
            color: #f0f0f0;
            font-size: 1.3rem;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #0a0a10, 0 6px 12px black;
            border: 1px solid #4a4a5e;
            line-height: 1;
        }
        
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0a0a10, 0 6px 12px black;
        }
        
        .canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            background: #14141c;
            border-radius: 28px;
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            max-width: 480px;
            box-shadow: 0 0 0 2px #2a2a38, 0 18px 30px rgba(0, 0, 0, 0.7);
            image-rendering: crisp-edges;
            /* keep pixels sharp */
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 16px;
            width: 100%;
            flex-wrap: wrap;
        }
        
        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #1a1a24;
            padding: 12px 16px;
            border-radius: 60px;
            box-shadow: inset 0 2px 8px #00000055, 0 6px 0 #08080e;
        }
        
        .dpad-row {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        
        .dpad button {
            background: #2d2d3f;
            border: none;
            color: #f0f0f0;
            font-size: 1.7rem;
            width: 64px;
            height: 64px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.05s ease;
            box-shadow: 0 6px 0 #121218, 0 8px 16px black;
            border: 1px solid #4e4e66;
            font-weight: bold;
            line-height: 1;
        }
        
        .dpad button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #121218, 0 8px 16px black;
        }
        
        .dpad .up,
        .dpad .down {
            margin: 0 auto;
        }
        
        .footer-note {
            color: #77778a;
            margin-top: 14px;
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            text-align: center;
        }
        
        @media (max-width: 450px) {
            .game-wrapper {
                padding: 14px;
                border-radius: 24px;
            }
            .dpad button {
                width: 52px;
                height: 52px;
                font-size: 1.5rem;
                border-radius: 24px;
            }
            .dpad-row {
                gap: 18px;
            }
            .restart-btn {
                width: 46px;
                height: 46px;
                font-size: 1.2rem;
            }
            .score-box {
                padding: 8px 16px;
                font-size: 1rem;
            }
            .score-box span {
                font-size: 1.3rem;
            }
        }
        
        @media (max-width: 360px) {
            .dpad button {
                width: 44px;
                height: 44px;
                font-size: 1.3rem;
            }
            .dpad-row {
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="game-wrapper">
        <div class="header">
            <div class="score-box">🍎 <span id="scoreDisplay">0</span></div>
            <button class="restart-btn" id="restartButton" aria-label="Restart game">↻</button>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Touch / click controls for all devices -->
        <div class="controls">
            <div class="dpad">
                <button class="up" data-dir="up" aria-label="up">▲</button>
                <div class="dpad-row">
                    <button class="left" data-dir="left" aria-label="left">◀</button>
                    <button class="down" data-dir="down" aria-label="down">▼</button>
                    <button class="right" data-dir="right" aria-label="right">▶</button>
                </div>
            </div>
        </div>
        <div class="footer-note">SWIPE or use buttons / arrow keys</div>
    </div>

    <script>
        (function() {
            // ---------- CONFIG ----------
            const GRID_SIZE = 20; // 20x20 grid
            const CELL_SIZE = 20; // logical canvas pixel size (400/20)
            const INIT_SNAKE = [{
                x: 10,
                y: 10
            }, {
                x: 9,
                y: 10
            }, {
                x: 8,
                y: 10
            }];
            const MOVE_INTERVAL_MS = 140; // speed (slightly faster for responsiveness)

            // ---------- DOM ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const restartBtn = document.getElementById('restartButton');

            // ---------- GAME STATE ----------
            let snake = [...INIT_SNAKE.map(p => ({...p
            }))];
            let food = {
                x: 15,
                y: 10
            }; // will be regenerated
            let direction = 'right'; // current moving direction
            let nextDirection = 'right'; // buffered direction
            let score = 0;
            let gameOver = false;
            let winFlag = false; // (not used, but for clarity)
            let gameInterval = null;
            let gameActive = false;

            // ---------- HELPER: generate random food (avoid snake) ----------
            function generateRandomFood() {
                const maxAttempts = 500;
                for (let i = 0; i < maxAttempts; i++) {
                    const fx = Math.floor(Math.random() * GRID_SIZE);
                    const fy = Math.floor(Math.random() * GRID_SIZE);
                    if (!snake.some(seg => seg.x === fx && seg.y === fy)) {
                        return {
                            x: fx,
                            y: fy
                        };
                    }
                }
                // extreme fallback – fill all free cells (very unlikely)
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (!snake.some(seg => seg.x === x && seg.y === y)) {
                            return {
                                x,
                                y
                            };
                        }
                    }
                }
                return null; // board full → win condition (handle in tick)
            }

            // ---------- RESET / INIT ----------
            function resetGame() {
                // stop interval if running
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }

                // reset state
                snake = INIT_SNAKE.map(p => ({...p
                }));
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                gameOver = false;
                gameActive = true;
                updateScore();

                // place food (avoid snake)
                const newFood = generateRandomFood();
                if (newFood) {
                    food = newFood;
                } else {
                    // extremely rare; board filled instantly? restart handles it later
                    food = {
                        x: 5,
                        y: 5
                    };
                }

                drawBoard();

                // start game loop
                gameInterval = setInterval(tick, MOVE_INTERVAL_MS);
            }

            // ---------- DRAWING ----------
            function drawBoard() {
                // background
                ctx.fillStyle = '#14141c';
                ctx.fillRect(0, 0, 400, 400);

                // draw grid lines (very subtle)
                ctx.strokeStyle = '#2a2a38';
                ctx.lineWidth = 0.7;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    const pos = i * CELL_SIZE;
                    ctx.beginPath();
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, 400);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, pos);
                    ctx.lineTo(400, pos);
                    ctx.stroke();
                }

                // draw food (apple style)
                if (food) {
                    const fx = food.x * CELL_SIZE;
                    const fy = food.y * CELL_SIZE;
                    // outer glow
                    ctx.shadowColor = '#ff5e5e';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#ff3b3b';
                    ctx.beginPath();
                    ctx.arc(fx + CELL_SIZE / 2, fy + CELL_SIZE / 2, CELL_SIZE / 2 - 2, 0, 2 * Math.PI);
                    ctx.fill();
                    // inner highlight
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ff7b7b';
                    ctx.beginPath();
                    ctx.arc(fx + CELL_SIZE / 2 - 3, fy + CELL_SIZE / 2 - 3, 3, 0, 2 * Math.PI);
                    ctx.fill();
                    // leaf
                    ctx.fillStyle = '#7ed957';
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#7ed957';
                    ctx.beginPath();
                    ctx.ellipse(fx + CELL_SIZE / 2 + 4, fy + CELL_SIZE / 2 - 8, 4, 6, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // draw snake (with soft glow)
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#6af06a';
                snake.forEach((seg, index) => {
                    const sx = seg.x * CELL_SIZE;
                    const sy = seg.y * CELL_SIZE;
                    const padding = index === 0 ? 1.5 : 2.5; // head slightly bigger
                    const radius = 5;

                    // gradient for snake segments
                    const gradient = ctx.createRadialGradient(
                        sx + 8, sy + 8, 2,
                        sx + 10, sy + 10, 14
                    );
                    if (index === 0) {
                        gradient.addColorStop(0, '#b3ffb3');
                        gradient.addColorStop(1, '#30d530');
                    } else {
                        gradient.addColorStop(0, '#7cf07c');
                        gradient.addColorStop(1, '#1e9e1e');
                    }
                    ctx.fillStyle = gradient;

                    ctx.beginPath();
                    ctx.roundRect(sx + padding, sy + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2, radius);
                    ctx.fill();

                    // eyes on head
                    if (index === 0) {
                        ctx.shadowBlur = 0; // eyes no glow
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(sx + 7, sy + 7, 2.5, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(sx + 13, sy + 7, 2.5, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.fillStyle = '#0a0a0a';
                        ctx.beginPath();
                        ctx.arc(sx + 8, sy + 6.5, 1.2, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(sx + 14, sy + 6.5, 1.2, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.shadowBlur = 12; // restore for next segment? reset later
                    }
                });
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';

                // game over overlay
                if (gameOver) {
                    ctx.fillStyle = 'rgba(10, 10, 16, 0.75)';
                    ctx.fillRect(0, 0, 400, 400);
                    ctx.font = 'bold 30px system-ui, sans-serif';
                    ctx.fillStyle = '#f0f0f0';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#ff4d4d';
                    ctx.shadowBlur = 20;
                    ctx.fillText('GAME OVER', 200, 200);
                    ctx.shadowBlur = 0;
                    ctx.font = '18px system-ui, sans-serif';
                    ctx.fillStyle = '#bbbbdd';
                    ctx.fillText('press restart', 200, 260);
                }
            }

            // helper canvas roundRect
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };

            // ---------- UPDATE SCORE ----------
            function updateScore() {
                scoreSpan.textContent = score;
            }

            // ---------- GAME TICK (move snake) ----------
            function tick() {
                if (!gameActive || gameOver) return;

                // commit buffered direction (no reversing)
                if (nextDirection === 'up' && direction !== 'down') direction = 'up';
                else if (nextDirection === 'down' && direction !== 'up') direction = 'down';
                else if (nextDirection === 'left' && direction !== 'right') direction = 'left';
                else if (nextDirection === 'right' && direction !== 'left') direction = 'right';

                // compute new head
                const head = snake[0];
                let newHead = {...head
                };
                switch (direction) {
                    case 'right':
                        newHead.x++;
                        break;
                    case 'left':
                        newHead.x--;
                        break;
                    case 'up':
                        newHead.y--;
                        break;
                    case 'down':
                        newHead.y++;
                        break;
                    default:
                        break;
                }

                // check wall collision
                if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                    gameOver = true;
                    gameActive = false;
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    drawBoard();
                    return;
                }

                // check food consumption
                const willEat = (food && newHead.x === food.x && newHead.y === food.y);

                // build new snake array (copy)
                let newSnake = [newHead, ...snake];

                if (willEat) {
                    // do not remove tail → snake grows
                    score++;
                    updateScore();
                } else {
                    // remove tail
                    newSnake.pop();
                }

                // self-collision check (head vs body)
                const headCollision = newSnake.slice(1).some(seg => seg.x === newHead.x && seg.y === newHead.y);
                if (headCollision) {
                    gameOver = true;
                    gameActive = false;
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    snake = newSnake; // show final snake
                    drawBoard();
                    return;
                }

                // apply new snake
                snake = newSnake;

                // if food was eaten, generate new food
                if (willEat) {
                    const newFood = generateRandomFood();
                    if (newFood) {
                        food = newFood;
                    } else {
                        // board completely full → win condition (treat as game over but with win message)
                        // we'll just set game over, but you can tweak overlay if needed
                        gameOver = true;
                        gameActive = false;
                        if (gameInterval) {
                            clearInterval(gameInterval);
                            gameInterval = null;
                        }
                    }
                }

                // redraw
                drawBoard();
            }

            // ---------- CHANGE DIRECTION (public) ----------
            function setDirection(dir) {
                if (!gameActive || gameOver) return;

                // prevent 180° reverse
                if (dir === 'up' && direction !== 'down') nextDirection = 'up';
                else if (dir === 'down' && direction !== 'up') nextDirection = 'down';
                else if (dir === 'left' && direction !== 'right') nextDirection = 'left';
                else if (dir === 'right' && direction !== 'left') nextDirection = 'right';
            }

            // ---------- EVENT LISTENERS ----------
            // Keyboard
            window.addEventListener('keydown', (e) => {
                const key = e.key;
                // prevent arrow scrolling
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                    e.preventDefault();
                }
                if (key === 'ArrowUp') setDirection('up');
                else if (key === 'ArrowDown') setDirection('down');
                else if (key === 'ArrowLeft') setDirection('left');
                else if (key === 'ArrowRight') setDirection('right');
                else if (key === 'r' || key === 'R') resetGame();
            });

            // Buttons (mobile/desktop)
            document.querySelectorAll('.dpad button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const dir = btn.getAttribute('data-dir');
                    if (dir) setDirection(dir);
                });
                // also support touch start for faster response (avoid double firing)
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const dir = btn.getAttribute('data-dir');
                    if (dir) setDirection(dir);
                }, {
                    passive: false
                });
            });

            // Restart button
            restartBtn.addEventListener('click', resetGame);
            restartBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                resetGame();
            }, {
                passive: false
            });

            // ---------- SWIPE SUPPORT (for canvas) ----------
            let touchStartX = 0,
                touchStartY = 0;
            let touchMoved = false;

            function handleTouchStart(e) {
                e.preventDefault(); // prevent zoom/scroll
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchMoved = false;
            }

            function handleTouchMove(e) {
                e.preventDefault();
                if (!touchStartX || !touchStartY || touchMoved) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                const threshold = 25; // min swipe distance

                if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

                touchMoved = true;
                if (Math.abs(dx) > Math.abs(dy)) {
                    // horizontal
                    if (dx > 0) setDirection('right');
                    else setDirection('left');
                } else {
                    // vertical
                    if (dy > 0) setDirection('down');
                    else setDirection('up');
                }

                // reset start coords to allow multiple swipes? but we want one swipe per gesture
                // We'll set touchStartX/Y to null to avoid repeat, until next touchstart
                touchStartX = 0;
                touchStartY = 0;
            }

            function handleTouchEnd(e) {
                e.preventDefault();
                touchStartX = 0;
                touchStartY = 0;
                touchMoved = false;
            }

            canvas.addEventListener('touchstart', handleTouchStart, {
                passive: false
            });
            canvas.addEventListener('touchmove', handleTouchMove, {
                passive: false
            });
            canvas.addEventListener('touchend', handleTouchEnd, {
                passive: false
            });
            canvas.addEventListener('touchcancel', handleTouchEnd, {
                passive: false
            });

            // Prevent context menu / long press on canvas & buttons
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            document.querySelectorAll('button').forEach(b => {
                b.addEventListener('contextmenu', (e) => e.preventDefault());
            });

            // Also prevent page zoom on double-tap (mobile)
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, {
                passive: false
            });

            // ---------- START GAME ----------
            resetGame();
        })();
    </script>
</body>

</html>
